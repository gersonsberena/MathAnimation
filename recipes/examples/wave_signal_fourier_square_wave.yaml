# Example recipe for the wave_signal engine (README Section 6, #9).
#
# NOTE: this engine exposes the "duration" param as `wave_duration` on the
# Scene (see engines/wave_signal.py) — Manim's own Scene.__init__ claims
# `self.duration` for internal bookkeeping, so `duration` can't be used as
# a Scene attribute name. The recipe-facing param name stays `duration`
# here per README Section 5's schema; an orchestrator mapping this
# category's params onto the Scene must translate duration -> wave_duration.

