# Title/caption/fb_post_caption variant pool per category, for batch
# recipe generation (batch/generate.py). Rotates hook phrasing across
# generated recipes so a run of them doesn't reuse identical text
# (README Section 10.2's "hook phrasing varies" checklist item).
#
# Variant 0 for every existing category is written independently of
# (not required to byte-match) the corresponding recipes/examples/*.yaml
# file's text -- generate_recipe() always overrides title/caption/
# fb_post_caption from here, on top of that file's params/common-block
# styling. Add more variants any time by editing this file; no code
# changes needed. Every category in engines/registry.py's
# CATEGORY_TO_SCENE_CLASS must have at least one entry here
# (tests/test_batch_generate.py checks this).

array_bar_race:
  - title: "Who Sorts Fastest?"
    caption: "Every swap, one step closer"
    fb_post_caption: "Bubble sort, one swap at a time. \U0001F440 #algorithms #sorting"
  - title: "Can You Predict The Winner?"
    caption: "Bubble sort: simple rule, slow climb"
    fb_post_caption: "7 numbers race to get sorted. Bubble sort is slow -- but it never fails. \U0001F422 #algorithms #sorting"

cellular_automata:
  - title: "One Rule, Every Generation"
    caption: "The rule never changes"
    fb_post_caption: "One rule. No exceptions. Watch what it builds. \U0001F9EC #math #gameoflife"
  - title: "It's Alive. It's Just Math."
    caption: "No AI. No randomness. Just one rule, repeated."
    fb_post_caption: "A glider that just... keeps gliding. From one simple rule. \U0001F9EC #math #cellularautomata"

game_theory:
  - title: "Only The Fittest Strategy Survives"
